# Общие настройки инструментов для всех девяти сервисов.
#
# Один файл на репозиторий, а не по одному на сервис: девять расходящихся
# конфигураций линтера — это девять разных представлений о том, что считается
# ошибкой, и споры о стиле вместо разговора о коде.
#
# Здесь нет настроек сборки: сервисы не пакеты, они собираются в образы.

[tool.ruff]
line-length = 100
target-version = "py313"
# Каталоги, которых линтер не касается: сгенерированное, чужое, кэш.
extend-exclude = [
    "reference",
    "**/__pycache__",
    "**/migrations",
]

[tool.ruff.lint]
# Набор намеренно узкий. Линтер здесь ловит ОШИБКИ, а не расставляет запятые:
# правило, которое спорит о вкусе, будет отключаться в коде, и вместе с ним
# отключится то, ради чего линтер стоял.
select = [
    "E",    # pycodestyle: длина строки, отступы
    "F",    # pyflakes: неиспользованное, неопределённое, затенённое
    "W",    # предупреждения pycodestyle
    "B",    # bugbear: изменяемые значения по умолчанию, except без типа
    "UP",   # устаревшие конструкции для целевой версии Python
    "C4",   # бессмысленные comprehension
    "RUF",  # правила самого ruff, включая кириллицу в идентификаторах
]
ignore = [
    # Русские строки с длинными словами: перенос ради ста символов делает
    # сообщение человеку хуже, а читает его человек.
    "E501",
    # `raise ... from` внутри обработчика: в коде есть места, где цепочка
    # исключений не добавляет ничего, кроме шума в логе.
    "B904",
    # `noqa: BLE001` расставлен по коду там, где широкий `except` намеренный:
    # воркер не имеет права умереть от одного плохого события. Правило BLE не
    # включено, но директивы оставлены как пометки намерения — снимать их
    # значит терять эту пометку.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Тесты: длинные фикстуры и намеренно «неправильные» данные — их работа.
"**/tests/**" = ["B011", "RUF001", "RUF002", "RUF003"]
# Комментарии и сообщения на русском по всему коду: кириллические символы,
# похожие на латинские, — это обычный русский текст, а не опечатка.
"**/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
# Строгость наращивается, а не включается разом: `strict` на существующем
# коде даёт тысячу ошибок, которые никто не читает, и проверку выключают.
# Здесь — то, что ловит настоящие ошибки и не требует переписывать всё.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Чужие библиотеки без аннотаций — не наша забота.
ignore_missing_imports = true
# Пока не включено: disallow_untyped_defs. Включать по сервису, когда
# аннотации доведены, — иначе проверка краснеет вся и не значит ничего.
exclude = [
    "reference/",
    "migrations/",
]

[tool.pytest.ini_options]
# Общие настройки тестов. У сервисов свои pytest.ini с маркерами.
addopts = "-ra --strict-markers"
