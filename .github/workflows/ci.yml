# CI потока 0.
#
# Повторяет подход платформы (reference/wb-fbs-gateway-template/README.md):
# зависимости + pytest против настоящего Postgres с применёнными по цепочке
# миграциями, pip-audit, отдельная валидация контрактов.
#
# Красный CI блокирует мерж — правило 9.5.5: чинит тот, чей контракт нарушен.

name: ci

on:
  push:
    # Любая ветка. Ветка, на которой CI не гоняется, — это ветка, о состоянии
    # которой узнают при мерже: правило 9.5.5 требует зелёный прогон ДО него,
    # а не после.
    branches: ['**']
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: очередь из десяти
# прогонов одной ветки никому не нужна, а последний всё равно единственный,
# по которому принимают решение.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Линтер и типы
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install --no-cache-dir ruff==0.8.6 mypy==1.14.1

      - name: ruff
        run: ruff check services tests infrastructure

      - name: mypy
        # По сервису: у всех девяти пакет называется `app`, и одним вызовом
        # mypy отказывается их различать.
        run: |
          failed=0
          for service in wms billing identity portal internal-admin \
                         fbs-operator-workstation; do
            echo "--- $service"
            ( cd "services/$service" && mypy --config-file ../../pyproject.toml app ) || failed=1
          done
          exit $failed

  audit:
    name: Зависимости без известных дыр
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Одна дыра в одном сервисе не должна прятать остальные восемь.
      fail-fast: false
      matrix:
        requirements:
          - services/wms/requirements.txt
          - services/wms/requirements-mock.txt
          - services/billing/requirements.txt
          - services/identity/requirements.txt
          - services/portal/requirements.txt
          - services/internal-admin/requirements.txt
          - services/fbs-operator-workstation/requirements.txt
          - services/fbs-operator-workstation/requirements-bus.txt
          - services/wb-simulator/requirements.txt
          - requirements-dev.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install --no-cache-dir pip-audit
      - run: pip-audit -r ${{ matrix.requirements }}

  simulator:
    name: Симулятор Wildberries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: |
          pip install --no-cache-dir -r services/wb-simulator/requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt

      - name: pytest
        working-directory: services/wb-simulator
        env: {APP_ENV: test}
        run: python -m pytest -q

  migrations:
    name: Миграции на чистой базе
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      - name: Накатить миграции по порядку
        env:
          DATABASE_URL: postgresql://wms:ci-only-not-a-secret@127.0.0.1:5432/wms
          MIGRATIONS_DIR: services/wms/migrations
        run: bash infrastructure/stand/scripts/migrate.sh

      # Повторный прогон обязан не сделать ничего: миграции применяются по
      # журналу, существующие не переписываются (правило 9.5).
      - name: Повторный прогон идемпотентен
        env:
          DATABASE_URL: postgresql://wms:ci-only-not-a-secret@127.0.0.1:5432/wms
          MIGRATIONS_DIR: services/wms/migrations
        run: |
          out="$(bash infrastructure/stand/scripts/migrate.sh)"
          echo "$out"
          echo "$out" | grep -q "миграции применены: 0"

      - name: Инварианты держатся на уровне схемы
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          # Журнал остатков нельзя переписать, баланс нельзя тронуть напрямую
          # (инвариант 3). Проверяем, что триггеры на месте и работают.
          psql -h 127.0.0.1 -U wms -d wms -v ON_ERROR_STOP=1 -c "
            SELECT 1/count(*) FROM pg_trigger
             WHERE NOT tgisinternal
               AND tgname IN ('stock_move_no_rewrite',
                              'stock_move_no_truncate',
                              'stock_move_project_balance',
                              'stock_balance_projection_only')
            HAVING count(*) = 4;"

  contracts:
    name: Контракты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install --no-cache-dir openapi-spec-validator jsonschema pyyaml
      - run: bash scripts/validate-contracts.sh

  # Тесты ядра требуют базы: смысл транзакции раздела 6.2 — блокировки,
  # триггеры проекции и ON CONFLICT, и без Postgres проверять в ней нечего.
  # Без DATABASE_URL тест конкурентного резерва — самый важный в проекте —
  # пропускался, а пропуск читается как успех. Postgres-сервис скопирован из
  # job migrations. Находка 4 потока A.
  tests:
    name: Тесты сервиса wms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install --no-cache-dir -r services/wms/requirements-mock.txt -r services/wb-simulator/requirements.txt pytest pip-audit

      - name: Накатить миграции
        env:
          DATABASE_URL: postgresql://wms:ci-only-not-a-secret@127.0.0.1:5432/wms
          MIGRATIONS_DIR: services/wms/migrations
        run: bash infrastructure/stand/scripts/migrate.sh

      # Тринадцать тестов ядра разговаривают с Wildberries через симулятор:
      # опрос, стикеры, сверка, публикация остатка. Без него они пропускаются,
      # а пропуск читается как успех — ровно то, ради чего этот job и чинили.
      - name: Поднять симулятор WB
        working-directory: services/wb-simulator
        run: |
          nohup python -m uvicorn app.api:app --host 127.0.0.1 --port 8090 >/tmp/wb-sim.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "симулятор WB не поднялся"; cat /tmp/wb-sim.log; exit 1

      - name: pytest
        working-directory: services/wms
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://wms:ci-only-not-a-secret@127.0.0.1:5432/wms
          WMS_TEST_DATABASE_URL: postgresql://wms:ci-only-not-a-secret@127.0.0.1:5432/wms
          # Один адрес и для проверки «симулятор поднят», и для самого клиента
          # WB: у них разные умолчания, и разъехавшись они дают не пропуск, а
          # ConnectError в середине теста.
          WB_SIMULATOR_URL: http://127.0.0.1:8090
        run: python -m pytest -q
      - name: pip-audit
        run: pip-audit -r services/wms/requirements.txt

  # Рабочее место. Заявка 6 потока B.
  workstation:
    name: Тесты рабочего места
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Postgres обязателен: набор `@pytest.mark.stand` исполняет КАЖДЫЙ
      # запрос `Store` на настоящем SQL. Без базы он пропускается, а именно
      # он ловит то, чего не видит подставной store: опечатку в имени
      # колонки, забытый RETURNING, значение вне CHECK.
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: workstation_test
          POSTGRES_USER: workstation
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U workstation -d workstation_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: |
          pip install --no-cache-dir -r services/fbs-operator-workstation/requirements-bus.txt
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Накатить схему рабочего места
        env:
          DATABASE_URL: postgresql://workstation:ci-only-not-a-secret@127.0.0.1:5432/workstation_test
          MIGRATIONS_DIR: services/fbs-operator-workstation/migrations
        run: bash infrastructure/stand/scripts/migrate.sh

      - name: pytest
        working-directory: services/fbs-operator-workstation
        env:
          APP_ENV: test
          WORKSTATION_TEST_DATABASE_URL: postgresql://workstation:ci-only-not-a-secret@127.0.0.1:5432/workstation_test
        run: python -m pytest -q

  secrets:
    name: Живых токенов WB нет
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Те же ворота, что и у стенда. Репозиторий проверяется целиком:
      # токен, доехавший до Git, уже утёк, даже если его потом удалить.
      - run: bash infrastructure/stand/scripts/check-no-live-tokens.sh .

  # ================================================================ поток C
  # Перенесено из ci-stream-c.yml. Половина правил биллинга живёт в схеме —
  # история закреплений без наложений, net_amount, раскладка комиссии, —
  # поэтому тесты идут против настоящего Postgres, как в CI платформы.


  billing:
    name: Биллинг — миграции и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U billing -d billing"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}

      - name: Миграции на чистой базе
        env:
          DATABASE_URL: postgresql://billing:ci-only-not-a-secret@127.0.0.1:5432/billing
          MIGRATIONS_DIR: services/billing/migrations
        run: bash infrastructure/stand/scripts/migrate.sh

      - name: Повторный прогон идемпотентен
        env:
          DATABASE_URL: postgresql://billing:ci-only-not-a-secret@127.0.0.1:5432/billing
          MIGRATIONS_DIR: services/billing/migrations
        run: |
          out="$(bash infrastructure/stand/scripts/migrate.sh)"
          echo "$out"
          echo "$out" | grep -q "миграции применены: 0"

      - name: Инварианты держатся на уровне схемы
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          # История закреплений без наложений, раскладка комиссии не больше
          # наценки, цикл в дереве менеджеров отбит. Всё это — база, не код.
          psql -h 127.0.0.1 -U billing -d billing -v ON_ERROR_STOP=1 -c "
            SELECT 1/count(*) FROM pg_constraint
             WHERE conname IN ('cabinet_assignment_no_overlap',
                               'price_layer_default_no_overlap',
                               'billing_tariff_version_no_overlap',
                               'billing_accrual_partner_within_amount')
            HAVING count(*) = 4;"
          psql -h 127.0.0.1 -U billing -d billing -v ON_ERROR_STOP=1 -c "
            SELECT 1/count(*) FROM pg_trigger
             WHERE NOT tgisinternal
               AND tgname IN ('partner_no_cycle',
                              'billing_commission_matches_accrual',
                              'billing_invoice_payout_follows_payment')
            HAVING count(*) = 3;"

      - name: Сид стенда воспроизводим
        run: |
          # Генератор читает сид потока 0 и обязан давать тот же файл: иначе
          # идентификаторы кабинетов разъедутся между потоками.
          python services/billing/seed/build-stand-seed.py
          git diff --exit-code services/billing/seed/stand-billing.sql

      - run: pip install --no-cache-dir -r services/billing/requirements.txt pytest pip-audit

      - name: pytest
        working-directory: services/billing
        env:
          APP_ENV: test
          BILLING_TEST_DATABASE_URL: postgresql://billing:ci-only-not-a-secret@127.0.0.1:5432/billing
        run: python -m pytest -q

      - name: pip-audit
        run: pip-audit -r services/billing/requirements.txt

  identity:
    name: Identity — роли
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: identity
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}

      - name: Миграция дополняющая и повторяемая
        env:
          DATABASE_URL: postgresql://identity:ci-only-not-a-secret@127.0.0.1:5432/identity
          MIGRATIONS_DIR: services/identity/migrations
        run: |
          # Дважды подряд: миграция накатывается на чужую базу поверх, и
          # повторный запуск не имеет права ничего сломать.
          bash infrastructure/stand/scripts/migrate.sh
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f services/identity/migrations/001_roles.sql

      - run: pip install --no-cache-dir -r services/identity/requirements.txt pytest pip-audit

      - name: pytest
        working-directory: services/identity
        env:
          APP_ENV: test
          IDENTITY_TEST_DATABASE_URL: postgresql://identity:ci-only-not-a-secret@127.0.0.1:5432/identity
        run: python -m pytest -q

      - name: pip-audit
        run: pip-audit -r services/identity/requirements.txt

  screens:
    name: Админка и ЛК клиента
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: screens
          POSTGRES_USER: screens
          POSTGRES_PASSWORD: ci-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U screens -d screens"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Фронт разбирается
        run: |
          # Ванильный JS без сборки (раздел 2.2) — значит, синтаксис некому
          # проверить, кроме браузера. Проверяем здесь.
          node --check services/internal-admin/static/app.js
          node --check services/portal/static/app.js

      - run: pip install --no-cache-dir -r services/internal-admin/requirements.txt pytest

      - name: pytest админки
        working-directory: services/internal-admin
        env:
          APP_ENV: test
          ADMIN_TEST_DATABASE_URL: postgresql://screens:ci-only-not-a-secret@127.0.0.1:5432/screens
        run: python -m pytest -q

      - name: pytest ЛК клиента
        working-directory: services/portal
        env:
          APP_ENV: test
          PORTAL_TEST_DATABASE_URL: postgresql://screens:ci-only-not-a-secret@127.0.0.1:5432/screens
        run: python -m pytest -q
