      name: wb.fbs.return.detected.v1
      title: Возврат обнаружен в WB
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type:
                const: wb.fbs.return.detected.v1
              payload:
                $ref: '#/components/schemas/ReturnDetectedPayload'

  schemas:
    # =========================================================================
    # Конверт. Раздел 2.4 и приложение E, без отклонений: ровно шесть полей,
    # все обязательны, additionalProperties запрещены. Запрет здесь не косметика —
    # он и есть техническая гарантия инварианта 15: поле `wb_token`, случайно
    # добавленное в конверт, не пройдёт валидацию при эмиссии.
    # =========================================================================
    EventEnvelope:
      type: object
      additionalProperties: false
      description: |
        Общий конверт шины `mmx.events`.

        Токены Wildberries, `secret_ref`, ключи и пароли не попадают ни в конверт,
        ни в `payload` — никогда (инвариант 15, раздел 12). При эмиссии тип события
        валидируется по `WmsEventType` для семейства `wms.*`.
      required:
        - event_id
        - tenant_id
        - type
        - occurred_at
        - payload
        - correlation_id
      properties:
        event_id:
          type: string
          format: uuid
          description: Ключ идемпотентности доставки. `outbox.event_id UNIQUE`.
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Арендатор платформы.
        type:
          type: string
          minLength: 1
          description: >-
            Имя типа события, оно же routing key в exchange `mmx.events`.
            Для семейства `wms.*` допустимы только значения `WmsEventType`
            (издаваемые) и `WmsCommandType` (принимаемые).
        occurred_at:
          type: string
          format: date-time
          description: >-
            Момент бизнес-факта, а не публикации. Между `occurred_at` и попаданием
            в брокер лежит outbox, задержка нормальна и не влияет на порядок:
            порядок задаёт `payload.sequence`.
        payload:
          type: object
          description: Тело события. Форма определяется полем `type`.
        correlation_id:
          type: string
          minLength: 1
          description: Сквозной идентификатор цепочки, от опроса WB до начисления.

    # =========================================================================
    # Примитивы. Вынесены, чтобы формат `task_id` был одинаков во всех двадцати
    # с лишним payload, а не «почти одинаков».
    # =========================================================================
    Uuid:
      type: string
      format: uuid

    OutboxSequence:
      type: integer
      minimum: 0
      description: |
        Номер события в пределах одного задания.

        ТРЕБОВАНИЕ К РЕАЛИЗАЦИИ (приложение E, последний абзац): инкремент выполняется
        в той же транзакции Postgres, что и движение товара, под блокировкой строки
        `wms_task`. Последовательность строго монотонна и без дыр в пределах `task_id`.
        В схеме это `outbox.sequence` при `outbox.aggregate_id = task_id`, защищённое
        уникальным индексом `outbox_sequence_key` — два события с одним номером
        по одному заданию база не примет.
        Потребитель обязан отбрасывать сообщения с `sequence`, не большим последнего
        обработанного для этого задания, — иначе переигрывание DLQ или повторная
        доставка RabbitMQ откатят состояние назад.

    Qty:
      type: integer
      minimum: 1
      description: Количество единиц товара. Ноль движением не является.

    Barcode:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        Штрихкод вещи на полке. У Wildberries это поле называется `sku`, но приходит
        в нём именно штрихкод (раздел 3.2): артикул определяет модель, штрихкод — вещь.

    SellerExternalId:
      type: string
      minLength: 1
      maxLength: 128
      description: >-
        Внешний идентификатор продавца (`owner.seller_external_id`). Едет рядом
        с `owner_id` там, где событие потребляет биллинг: он знает клиента по
        внешнему ключу, а не по uuid склада.

    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'

    StockState:
      type: string
      description: Состояние товара (раздел 7). Домен `wms_stock_state` в схеме БД.
      enum:
        - good
        - reserved
        - quarantine
        - defect
        - blocked
        - processing

    ScanResult:
      type: string
      description: >-
        Результат скана у стойки (`pick_line.scan_result`). Чужой штрихкод и чужой
        владелец — разные исходы: первое ошибка сборщика, второе нарушение изоляции
        владельца (инвариант 6) и повод для алерта.
      enum:
        - ok
        - wrong_barcode
        - wrong_owner
        - not_found
        - short

    ReservationErrorCode:
      type: string
      description: >-
        Коды отказа резерва — закрытый список из приложения C, сохранены все.
        Свободная строка здесь запрещена: в боевом контуре именно она превращала
        `PRODUCT_MAPPING_MISSING` в отмену без причины.
      enum:
        - SELLER_MAPPING_MISSING
        - PRODUCT_MAPPING_MISSING
        - AMBIGUOUS_PRODUCT_MAPPING
        - WAREHOUSE_UNKNOWN
        - INSUFFICIENT_STOCK
        - SERIALIZATION_RETRY
        # Добавлены в 1.3.0 (этап 2 аудита, docs/schema-decisions.md).
        - OWNER_INACTIVE
        - UNPROCESSABLE_ORDER

    LabelFormat:
      type: string
      description: >-
        `WB_STICKER_FORMAT`. Целевое значение `zplv` (раздел 6.6), `png` остаётся
        как откат, пока формат не подтверждён живым принтером (раздел 13, вопрос 2).
      enum:
        - png
        - svg
        - zplv
        - zplh

    TaskStatus:
      type: string
      description: >-
        Канонический статус задания в терминах поглощённого шлюза. Используется
        в `InventoryMovementPayload` и `TaskProjection` — форма перенесена как есть,
        под неё уже написаны потребители.
      enum:
        - RECEIVED
        - MANUAL_REVIEW
        - RESERVATION_REQUESTED
        - RESERVED
        - RESERVATION_FAILED
        - PICKING
        - PICKED
        - PACKING
        - PACKED
        - SUPPLY_ASSIGNED
        - LABEL_PENDING
        - LABEL_READY
        - READY_FOR_DELIVERY
        - IN_DELIVERY_BATCH
        - OUT_FOR_DELIVERY
        - HANDED_TO_WB
        - ACCEPTED_BY_WB
        - RESHIPMENT_REQUIRED
        - DELIVERY_FAILED
        - RETURN_REQUESTED
        - RETURNED_TO_WMS
        - CANCELLED

    WmsTaskState:
      type: string
      description: >-
        Состояние `wms_task.state` — автомат задания из раздела 7. Отличается от
        `TaskStatus`: это внутреннее состояние новой WMS. Полная таблица соответствия
        `wms_task.state` ↔ рабочее место ↔ канонический ↔ WB — `docs/state-mapping.md`.

        `handed` и `accepted` в разделе 7 не перечислены, но добавлены в схему
        (`migrations/003_tasks_reservations.sql`): «передано человеком» и
        «подтверждено сверкой» — разные факты, `complete` у WB приёмку не доказывает
        (раздел 2.12). Список здесь держится в точности как CHECK в базе.
      enum:
        - new
        - reserved
        - picking
        - picked
        - packed
        - labeled
        - in_supply
        - shipped
        - handed
        - accepted
        - short
        - cancelled
        - manual_review
        - diverged

    WmsEventType:
      type: string
      description: |
        Список `WMS_EVENT_TYPES` из приложения E — валидируется при эмиссии.
        Расширен на `wms.stock.shortfall.v1` (версия 1.2 мастера, раздел 6.5).

        Обратить внимание: `wms.reserve.v1`, `wms.cancel.v1`, `wms.return.v1` и
        `wms.return-request.v1` сюда не входят — это команды, а не события
        (см. `WmsCommandType`). `wms.stock.released.v1` в приложении A каталога
        событий есть, а в списке приложения E его нет; расхождение исходных
        документов, разрешено в пользу приложения E — список валидации не
        расширяем, канал существует и издаётся.
      enum:
        - wms.reservation.succeeded.v1
        - wms.reservation.failed.v1
        - wms.picking.started.v1
        - wms.item.scanned.v1
        - wms.picking.completed.v1
        - wms.packing.completed.v1
        - wms.label.attached.v1
        - wms.returned.to.shelf.v1
        - wms.return.expected.v1
        - wms.return.received.v1
        - wms.return.resellable.v1
        - wms.return.defective.v1
        - wms.order.cancelled.v1
        - wms.stock.shortfall.v1

    WmsCommandType:
      type: string
      description: >-
        Команды, которые wms принимает из шины. В целевой модели не используются —
        резерв и отмена стали транзакцией (раздел 6.2). Держатся до переключения
        последнего кабинета (раздел 11, шаг 6).
      enum:
        - wms.reserve.v1
        - wms.cancel.v1
        - wms.return.v1
        - wms.return-request.v1

    # =========================================================================
    # Payload команд. Формы взяты из приложения C дословно.
    # =========================================================================
    ReserveCommandPayload:
      type: object
      additionalProperties: false
      description: Приложение C, «Резерв» (`/reservations`).
      required:
        - request_id
        - idempotency_key
        - seller_external_id
        - wb_account_external_id
        - wb_order_id
        - order_uid
        - sku
        - barcode
        - quantity
      properties:
        request_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
          description: >-
            Повтор возвращает тот же ответ и не создаёт второго движения
            (инвариант 5).
        gateway_order_id:
          type: ['string', 'null']
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        wb_account_external_id:
          type: string
          minLength: 1
        wb_order_id:
          type: integer
          format: int64
        order_uid:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
          description: Поле WB. Содержит штрихкод, а не артикул (раздел 3.2).
        barcode:
          $ref: '#/components/schemas/Barcode'
        quantity:
          $ref: '#/components/schemas/Qty'
        deadline:
          type: ['string', 'null']
          format: date-time
          description: Срок WB. Выдача заданий сборщикам сортируется по нему, а не по времени создания.
        correlation_id:
          type: ['string', 'null']

    CancelCommandPayload:
      type: object
      additionalProperties: false
      description: Приложение C, «Отмена» (`/tasks/{id}/cancel`).
      required:
        - task_id
        - cancellation_event_id
        - handed_over
        - reason
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        cancellation_event_id:
          type: string
          minLength: 1
          description: Ключ идемпотентности отмены.
        handed_over:
          type: boolean
          description: >-
            Физически передано перевозчику. Если true — это не стоп, а разбор
            возврата (раздел 2.12).
        reason:
          type: string
          minLength: 1
          description: >-
            Обязательна. `wms_task.cancel_reason NOT NULL при state='cancelled'`
            (инвариант 11).

    ReturnCommandPayload:
      type: object
      additionalProperties: false
      description: Приложение C, «Возврат» (`/tasks/{id}/return`).
      required:
        - task_id
        - return_event_id
        - seller_external_id
        - reason
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        return_event_id:
          type: string
          minLength: 1
          description: Внешний ключ идемпотентности, `wms_return.return_event_id UNIQUE`.
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        reason:
          type: string
          minLength: 1

    ReturnRequestPayload:
      type: object
      additionalProperties: false
      required:
        - return_event_id
        - seller_external_id
        - reason
      properties:
        return_event_id:
          type: string
          minLength: 1
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: >-
            Может отсутствовать: WB присылает возвраты, которые к нашему заданию
            не привязываются (`wb.return.unmatched.v1` в каталоге as-is).
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        reason:
          type: string
          minLength: 1

    # =========================================================================
    # Payload событий резерва, подбора и отгрузки.
    # Имена полей — из раздела 7 мастера, чтобы payload читался тем же словарём,
    # что и таблицы: owner_id, sku_id, cell_id, box_id, task_id, qty, reason, state.
    # =========================================================================
    ReservationSucceededPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - reservation_id
        - owner_id
        - sku_id
        - qty
        - wb_order_id
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        reservation_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        barcode:
          $ref: '#/components/schemas/Barcode'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        wb_order_id:
          type: integer
          format: int64
        deadline:
          type: ['string', 'null']
          format: date-time
        ledger_short:
          type: boolean
          default: false
          description: >-
            Резерв создан клапаном 6.5, товара по учёту не было. Рядом обязано
            уйти `wms.stock.shortfall.v1` с тем же `task_id`.
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    ReservationFailedPayload:
      type: object
      additionalProperties: false
      required:
        - wb_order_id
        - barcode
        - quantity
        - error_code
        - sequence
      properties:
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: >-
            null, если задание не удалось даже создать (например,
            `SELLER_MAPPING_MISSING` — владелец неизвестен).
        owner_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        wb_order_id:
          type: integer
          format: int64
        barcode:
          $ref: '#/components/schemas/Barcode'
        quantity:
          $ref: '#/components/schemas/Qty'
        error_code:
          $ref: '#/components/schemas/ReservationErrorCode'
        manual_review_code:
          oneOf:
            - $ref: '#/components/schemas/ReservationErrorCode'
            - type: 'null'
          description: >-
            Заполнен, когда задание ушло в `manual_review`. Товар без маппинга —
            это `manual_review` с кодом, а не остаток и не тихая отмена
            (инвариант 6, раздел 3.2).
        manual_review_reason:
          type: ['string', 'null']
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    StockShortfallPayload:
      type: object
      additionalProperties: false
      description: |
        Сборка без остатка — клапан `ledger_short` (раздел 6.5).

        Состав полей заморожен потоком 0 ровно в этом виде (файл 01, пункт 3):
        `owner_id`, `sku_id`, `cell_id`, `qty_short`, `task_id`. Ничего больше
        сюда не добавляется — событие адресует расхождение, а не описывает задание.
        В той же транзакции пишутся движение с `reason = 'ledger_short'` и
        `discrepancy(kind='ledger_short')`; событие — третий след из трёх
        (инвариант 12).
      required:
        - owner_id
        - sku_id
        - cell_id
        - qty_short
        - task_id
      properties:
        owner_id:
          $ref: '#/components/schemas/Uuid'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        cell_id:
          $ref: '#/components/schemas/Uuid'
        qty_short:
          type: integer
          minimum: 1
          description: Сколько единиц дописано сверх учётного остатка.
        task_id:
          $ref: '#/components/schemas/Uuid'

    PickingStartedPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - session_id
        - owner_id
        - actor_id
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        session_id:
          $ref: '#/components/schemas/Uuid'
          description: >-
            `pick_session.id`. Сессия многопродавцовая: один обход собирает задания
            нескольких клиентов (раздел 4).
        owner_id:
          $ref: '#/components/schemas/Uuid'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        station_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    ItemScannedPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - owner_id
        - sku_id
        - barcode
        - qty
        - scan_result
        - actor_id
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        barcode:
          $ref: '#/components/schemas/Barcode'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Коробка, которую сборщик «пикнул» у стойки (раздел 2.9).
        qty:
          $ref: '#/components/schemas/Qty'
        scan_result:
          $ref: '#/components/schemas/ScanResult'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        station_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    PickingCompletedPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - session_id
        - owner_id
        - picked_qty
        - actor_id
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        session_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        picked_qty:
          type: integer
          minimum: 0
          description: Ноль допустим — это недостача, задание уходит в `short`.
        actor_id:
          $ref: '#/components/schemas/Uuid'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    PackingCompletedPayload:
      type: object
      additionalProperties: false
      description: >-
        Контрольный скан пройден, задание упаковано. Тарифицируемая операция:
        поток C начисляет по ней (amount 45, partner_amount 15, net_amount 30).
      required:
        - task_id
        - owner_id
        - sku_id
        - qty
        - actor_id
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        barcode:
          $ref: '#/components/schemas/Barcode'
        qty:
          $ref: '#/components/schemas/Qty'
        package_ref:
          type: ['string', 'null']
          description: '`wms_task.package_ref` — упаковка или транспортный короб.'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        station_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    ReceiptCompletedPayload:
      type: object
      additionalProperties: false
      description: >-
        Приёмка завершена. Событие несёт ровно то, чем её тарифицируют и по чему
        находят документ: чей товар, какая приёмка, сколько принято по факту.

        Количество — `accepted_qty`, фактически принятое, а не ожидавшееся:
        приёмка с недостачей тарифицируется по тому, что реально легло на полку
        (шаг 3 полного прогона проверяет, что баланс идёт по факту, а не по
        ожиданию). Строки в событие не кладутся: их читают по `/receipts/screen`,
        событие — уведомление, а не способ доставки (раздел 6.1).
      required:
        - receipt_id
        - owner_id
        - seller_external_id
        - doc_ref
        - accepted_qty
        - occurred_at
        - sequence
      properties:
        receipt_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        doc_ref:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            `receipt.reference` — внешний ключ идемпотентности приёмки
            (инвариант 5). По нему начисление сходится с документом склада.
        accepted_qty:
          type: integer
          minimum: 0
          description: Суммарно принято по факту, по всем строкам документа.
        lines_count:
          type: integer
          minimum: 0
          description: Сколько строк в приёмке — единица тарифа «за строку», если владелец выберет её вместо штуки.
        discrepancies_count:
          type: integer
          minimum: 0
          description: >-
            Сколько строк разошлось с ожиданием. Ноль — приёмка сошлась;
            больше нуля — есть что разбирать на экране начальника склада.
        warehouse_code:
          type: string
          minLength: 1
          maxLength: 32
        occurred_at:
          type: string
          format: date-time
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    OrdersProcessedPayload:
      type: object
      additionalProperties: false
      description: >-
        `wb.orders.processed.v1` — реальный тип с прода: 150 ₽ за месяц в
        диагностике раздела 3, и раздел 3.4 числит его тарифицируемым. Формы
        payload при этом не было нигде — ни в приложении E, ни здесь, — и
        биллинг считал количество единицей как временную меру. При настоящем
        payload с пачкой заказов клиент был бы недосчитан ровно во столько раз,
        сколько заказов в пачке. Форма зафиксирована в версии 1.3 мастера.
      required:
        - seller_id
        - orders
        - occurred_at
      properties:
        owner_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Владелец в терминах `wms`, если он известен отправителю.
        seller_id:
          $ref: '#/components/schemas/SellerExternalId'
          description: >-
            Кабинет клиента — кому выставляется счёт. Обязателен: без него
            начисление повисает в отчёте с причиной SELLER_UNKNOWN.
        orders:
          type: integer
          minimum: 0
          description: >-
            Сколько заказов обработано — тарифицируемое количество. Именно это
            число умножается на тариф, а не единица за событие.
        wb_account_external_id:
          type: string
          minLength: 1
          maxLength: 128
        occurred_at:
          type: string
          format: date-time

    LabelAttachedPayload:
      type: object
      additionalProperties: false
      description: >-
        Содержимое этикетки в событие не кладётся: до 10 МБ полезной нагрузки
        через шину — это не уведомление. ZPL лежит в `wb_label` и отдаётся
        по `/labels/{task_id}/print`.
      required:
        - task_id
        - label_id
        - owner_id
        - format
        - checksum
        - version
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        label_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
          description: >-
            Владелец товара. Обязателен: стикеровка — тарифицируемая услуга
            (раздел 3.4), и без владельца биллингу некому её выставить —
            строка повисает в отчёте с причиной SELLER_UNKNOWN. Был
            необязательным до версии 1.3 мастера; поток C нашёл это на стенде.
        format:
          $ref: '#/components/schemas/LabelFormat'
        checksum:
          $ref: '#/components/schemas/Sha256'
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        supply_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: >-
            Стикер выдаётся WB только для задания, уже лежащего в поставке, —
            требование WB, сохранено (раздел 3.3).
        fetched_at:
          type: string
          format: date-time
          description: >-
            Когда стикер был получен от WB. Должен быть раньше начала подбора
            (инвариант 9, шаг 7 полного прогона).
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    ReturnedToShelfPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - owner_id
        - sku_id
        - qty
        - reason
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        state_to:
          $ref: '#/components/schemas/StockState'
        reason:
          type: string
          minLength: 1
          description: '`stock_move.reason` — почему вещь вернулась на полку.'
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    StockReleasedPayload:
      type: object
      additionalProperties: false
      description: >-
        Резерв снят, `qty` вернулось из `reserved` в `good`. Следом обязано уйти
        `inventory.stock.updated.v1` и немедленная публикация остатка в WB
        (раздел 6.4).
      required:
        - task_id
        - reservation_id
        - owner_id
        - sku_id
        - qty
        - release_reason
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        reservation_id:
          $ref: '#/components/schemas/Uuid'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        release_reason:
          type: string
          minLength: 1
          description: '`reservation.release_reason`.'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    OrderCancelledPayload:
      type: object
      additionalProperties: false
      required:
        - task_id
        - wb_order_id
        - owner_id
        - cancel_reason
        - sequence
      properties:
        task_id:
          $ref: '#/components/schemas/Uuid'
        wb_order_id:
          type: integer
          format: int64
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        cancel_reason:
          type: string
          minLength: 1
          description: >-
            Обязательна. Пустая причина — это те самые 2645 отмен без объяснения
            в боевом контуре (раздел 3).
        handed_over:
          type: boolean
          default: false
        released_qty:
          type: integer
          minimum: 0
          description: Сколько вернулось в `good`. Ноль, если резерва не было.
        label_invalidated:
          type: boolean
          default: false
          description: >-
            Стикер помечен недействительным, заказ освобождён из поставки
            (`release_from_supply`, раздел 6.6).
        state:
          $ref: '#/components/schemas/WmsTaskState'
        sequence:
          $ref: '#/components/schemas/OutboxSequence'

    # =========================================================================
    # Возвраты. Контрактный минимум: принять и решить (раздел 6.7).
    # =========================================================================
    ReturnExpectedPayload:
      type: object
      additionalProperties: false
      required:
        - return_id
        - return_event_id
        - owner_id
      properties:
        return_id:
          $ref: '#/components/schemas/Uuid'
        return_event_id:
          type: string
          minLength: 1
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        reason:
          type: ['string', 'null']

    ReturnReceivedPayload:
      type: object
      additionalProperties: false
      required:
        - return_id
        - owner_id
        - qty
      properties:
        return_id:
          $ref: '#/components/schemas/Uuid'
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        state_to:
          $ref: '#/components/schemas/StockState'
          description: >-
            Куда лёг товар до решения. Обычно `quarantine`: принят физически,
            но продавать его ещё нельзя.
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    ReturnDecisionPayload:
      type: object
      additionalProperties: false
      description: >-
        Общая форма решения по возврату. Конкретный тип события сужает `decision`
        и `state_to`: `wms.return.resellable.v1` → good, `wms.return.defective.v1`
        → defect. Одна схема на два события — чтобы поток C писал один обработчик,
        а не два расходящихся.
      required:
        - return_id
        - owner_id
        - qty
        - decision
      properties:
        return_id:
          $ref: '#/components/schemas/Uuid'
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Qty'
        decision:
          type: string
          enum:
            - resellable
            - defective
        state_to:
          $ref: '#/components/schemas/StockState'
        cell_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        box_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reason:
          type: ['string', 'null']
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    # =========================================================================
    # Журнал остатков.
    # InventoryMovementPayload перенесён из приложения E дословно — форма as-is,
    # менять её значит ломать уже написанных потребителей.
    # =========================================================================
    InventoryMovementPayload:
      type: object
      additionalProperties: false
      description: >-
        Приложение E, `inventory.movement.recorded.v1`. Форма зафиксирована as-is.
        Событие издаётся из той же транзакции, что записала `stock_move`;
        `stock_move` append-only, триггер запрещает UPDATE и DELETE (инвариант 3).
      required:
        - movement_type
        - sku
        - quantity
        - order_id
        - status
        - occurred_at
      properties:
        movement_type:
          $ref: '#/components/schemas/WmsEventType'
        sku:
          type: string
          minLength: 1
        quantity:
          type: number
        order_id:
          type: integer
        status:
          $ref: '#/components/schemas/TaskStatus'
        occurred_at:
          type: string
          format: date-time
        reference:
          type: ['string', 'number', 'null']

    InventoryStockUpdatedPayload:
      type: object
      additionalProperties: false
      description: >-
        Проекция `stock_balance` после движения. `available` считается по формуле
        раздела 6.4 и всегда занижается; отрицательное значение в WB не уезжает —
        строки с отрицательным `available` отбрасываются (приложение C).
      required:
        - owner_id
        - sku_id
        - barcode
        - good
        - reserved
        - buffer
        - available
      properties:
        owner_id:
          $ref: '#/components/schemas/Uuid'
        seller_external_id:
          $ref: '#/components/schemas/SellerExternalId'
        sku_id:
          $ref: '#/components/schemas/Uuid'
        barcode:
          $ref: '#/components/schemas/Barcode'
        good:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        buffer:
          type: integer
          minimum: 0
          description: '`sku.buffer` — страховой запас.'
        available:
          type: integer
          minimum: 0
          description: 'good - buffer, не ниже нуля. Резерв уже вычтен движением good → reserved.'
        published_to_wb:
          type: boolean
          default: false
          description: >-
            Ушла ли публикация в WB. Отдельный флаг, потому что публикация живёт
            вне транзакции: событие едет сразу, вызов WB может ждать ограничителя.

    # =========================================================================
    # Унаследованные от шлюза схемы. Приложение E, перенесены дословно:
    # additionalProperties у них не запрещены намеренно — приложение E задаёт
    # только обязательные поля, а гейтвей исторически кладёт больше.
    # =========================================================================
    TaskPayload:
      type: object
      description: '`wb.fbs.order.synced.v1`, `wb.fbs.order.updated.v1`.'
      required:
        - task
      properties:
        task:
          $ref: '#/components/schemas/TaskProjection'

    TaskProjection:
      type: object
      description: >-
        Публичная проекция задания шлюза. Токенов и секретов не содержит и не будет
        содержать (инвариант 15); внутренний `last_wms_sequence` наружу не отдаётся.
      required:
        - id
        - seller_id
        - account_id
        - order_id
        - order_uid
        - sku
        - wb_status
        - status
        - version
        - updated_at
      properties:
        id:
          type: string
        seller_id:
          type: string
        account_id:
          type: string
        order_id:
          type: integer
          format: int64
        order_uid:
          type: string
        sku:
          type: string
          description: Поле WB. Содержит штрихкод (раздел 3.2).
        destination:
          type: ['integer', 'null']
        cargo_type:
          type: ['integer', 'null']
        deadline:
          type: ['string', 'null']
        required_meta:
          type: array
          items:
            type: string
        optional_meta:
          type: array
          items:
            type: string
        is_b2b:
          type: ['boolean', 'null']
        cross_border_type:
          type: ['integer', 'null']
        wb_status:
          type: string
          enum:
            - new
            - confirm
            - complete
            - cancel
        wb_system_status:
          type: ['string', 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        wms_task_id:
          type: ['string', 'null']
        supply_id:
          type: ['string', 'null']
        label_id:
          type: ['string', 'null']
        delivery_batch_id:
          type: ['string', 'null']
        version:
          type: integer
          minimum: 1
        manual_reason:
          type: ['string', 'null']
        last_reconciled_at:
          type: ['string', 'null']
        reshipment_source_supply_id:
          type: ['string', 'null']
        updated_at:
          type: string

    SupplyShippedPayload:
      type: object
      description: 'Приложение E, `wb.supply.shipped.v1`. Тарифицируемое событие.'
      required:
        - supply
        - seller_id
        - orders
        - accepted_at
        - name
      properties:
        supply:
          type: string
          description: Идентификатор поставки WB (WB-GI-…).
        seller_id:
          type: string
          description: Организация клиента, кому выставляется счёт.
        orders:
          type: integer
          minimum: 0
          description: Заказов в поставке — тарифицируемое количество.
        accepted_at:
          type: ['string', 'null']
          format: date-time
          description: >-
            Когда WB отсканировал QR поставки (`scanDt`). null — поставка передана,
            но приёмка WB не подтверждена; это не доказательство приёмки (раздел 2.12).
        name:
          type: string

    ReturnDetectedPayload:
      type: object
      description: 'Приложение E, `wb.fbs.return.detected.v1`.'
      required:
        - return_id
        - task_id
      properties:
        return_id:
          type: string
          pattern: '^wb-[0-9a-f-]{36}$'
        task_id:
          type: string
          format: uuid
