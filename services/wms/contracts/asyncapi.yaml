components:
  securitySchemes:
    amqpUserPassword:
      type: userPassword
      description: >-
        Логин и пароль сервисного пользователя RabbitMQ. Берутся только из env
        по паттерну `${VAR:?set outside Git}` (раздел 12), в репозиторий не попадают.

  channelBindings:
    mmxEvents:
      amqp:
        is: routingKey
        exchange:
          name: mmx.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0

  operationBindings:
    persistent:
      amqp:
        # deliveryMode 2 = persistent. Outbox переживает рестарт брокера: событие уже
        # закоммичено вместе с движением товара, потерять его при перезапуске RabbitMQ
        # значит разойтись с базой.
        deliveryMode: 2
        mandatory: false
        bindingVersion: 0.3.0

  messages:
    # Каждое сообщение — это конверт EventEnvelope, у которого сужены ровно два поля:
    # `type` до константы и `payload` до конкретной схемы. Сужение через allOf, а не
    # копированием конверта: копия однажды разойдётся с оригиналом, и разойдётся молча.
    wms.reserve.v1:
      name: wms.reserve.v1
      title: Команда резерва
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              type:
                const: wms.reserve.v1
              payload:
                $ref: '#/components/schemas/ReserveCommandPayload'

