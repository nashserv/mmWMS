# Каталог событий сервиса `wms` — заморожен потоком 0.
#
# Зачем этот файл: потоки B (приложение сборщика) и C (деньги и кабинеты) пишут
# консьюмеры до того, как поток A напишет продюсера. Расплывчатый каталог означает,
# что три агента будут спорить о форме сообщения вместо того, чтобы её использовать.
# Поэтому здесь заморожены имена событий, форма конверта и форма каждого payload.
#
# Источники (правки только вместе с ними, потоком 0 — правило 9.5.2 мастера):
#   * приложение A мастер-контекста — список событий as-is;
#   * приложение E — конверт, WMS_EVENT_TYPES и дословные схемы payload;
#   * раздел 7 — модель данных, откуда взяты имена полей (owner_id, sku_id, cell_id,
#     box_id, task_id, qty, reason, state);
#   * раздел 6.5 — новое событие wms.stock.shortfall.v1;
#   * раздел 8 — инварианты, в первую очередь 15 (секреты в события не попадают).
#
# Почему AsyncAPI 3.0.0, а не 2.6: в 3.0.0 направление задаётся операцией, а не
# каналом. Здесь через один exchange идут и события, которые wms издаёт, и четыре
# унаследованные команды, которые wms принимает; в 2.6 пришлось бы либо заводить
# два документа, либо описывать команды как publish с точки зрения чужого сервиса.
# Биндинги RabbitMQ (amqp 0.3.0) в 3.0.0 те же самые.

asyncapi: 3.0.0

id: urn:mmx:wms:contracts:asyncapi

info:
  title: MM-Express WMS — каталог событий
  version: 1.3.0
  description: |
    События сервиса `wms` — единственного владельца склада и интеграции с Wildberries
    после вывода Odoo и поглощения `wb-fbs-gateway` (разделы 6.3 и 6.7 мастер-контекста).

    **Событие — это уведомление, а не способ доставки** (раздел 6.1). Задание доступно
    рабочему месту через `POST /api/mmx/wms/v1/tasks/pull` сразу после коммита
    транзакции, без публикации события (инвариант 8). Потребители событий — биллинг,
    портал, аналитика; склад от шины не зависит и продолжает работать при выключенном
    RabbitMQ (проверка 14 полного прогона, раздел 9.6).

    **Порядок событий по заданию.** `outbox.sequence` инкрементируется в ТОЙ ЖЕ
    транзакции Postgres, что и движение товара (`stock_move`) — см. `x-ordering-guarantee`
    ниже и схему `OutboxSequence`. Потребители полагаются на монотонность `sequence`
    в пределах одного задания и обязаны отбрасывать сообщение с `sequence`, не большим
    последнего обработанного для этого `task_id`.

    **Секреты.** Токены Wildberries, `secret_ref`, заголовки авторизации и любые другие
    секреты не попадают ни в конверт, ни в payload — никогда (инвариант 15, раздел 12).
    Это касается и полей вроде `payload` этикетки: в `wms.label.attached.v1` едут
    идентификатор, формат и контрольная сумма, но не сам ZPL.
  contact:
    name: Поток 0 — контракты и стенд
  license:
    name: Proprietary — MM-Express
    url: https://mm-express.example/license
  tags:
    - name: wms-core
      description: Приёмка, резерв, подбор, упаковка, отгрузка
    - name: wms-returns
      description: Возвраты — контрактный минимум (раздел 6.7)
    - name: inventory
      description: Журнал остатков и публикация остатка
    - name: wb-inherited
      description: События поглощённого шлюза Wildberries (раздел 6.3)
    - name: legacy-command
      description: Команды as-is, целевой моделью не используются (раздел 6.2)

  # Требование к реализации, а не описание. Проверяется тестом потока A и шагами 4 и 6
  # полного прогона (раздел 9.6): движение, запись в outbox и инкремент sequence
  # видны атомарно, либо не видны вовсе.
  x-ordering-guarantee:
    scope: task_id
    field: payload.sequence
    rule: >-
      INSERT INTO outbox (aggregate_id, sequence, ...) выполняется в той же транзакции,
      что и INSERT INTO stock_move / UPDATE wms_task. Номер берётся под блокировкой
      строки задания (SELECT ... FOR UPDATE по wms_task.id), поэтому в пределах одного
      task_id последовательность строго монотонна и без дыр. Уникальность пары
      (aggregate_id, sequence) закреплена индексом outbox_sequence_key.
    consumer_contract: >-
      Потребитель хранит последний обработанный sequence по task_id и отбрасывает
      сообщения с sequence <= сохранённого. Это единственная защита от переигрывания
      DLQ и повторной доставки RabbitMQ (at-least-once).

defaultContentType: application/json

servers:
  stand:
    host: 'rabbitmq:5672'
    protocol: amqp
    protocolVersion: '0.9.1'
    description: |
      Стенд `151.245.140.225` (приложение F). RabbitMQ 4.1.2, exchange `mmx.events`.
      Живых токенов WB на стенде нет и быть не должно — проверка первым шагом
      при разворачивании (раздел 12).
    security:
      - $ref: '#/components/securitySchemes/amqpUserPassword'
  production:
    host: 'rabbitmq:5671'
    protocol: amqps
    protocolVersion: '0.9.1'
    description: 'Боевой контур: тот же exchange, но AMQPS (раздел 2.2).'
    security:
      - $ref: '#/components/securitySchemes/amqpUserPassword'

# Один topic-exchange `mmx.events` на всю платформу. Канал = routing key = имя типа
# события: потребитель подписывается маской (`wms.return.*`, `inventory.#`) и не
# зависит от того, какие ещё события мы добавим рядом.
channels:
  # ---------------------------------------------------------------------------
  # Команды as-is. В целевой модели резерв, отмена и возврат — это транзакция
  # внутри wms, а не сообщение через очередь (разделы 6.2 и 6.3: gateway-command-worker
  # исчезает). Каналы сохранены, потому что до полного переключения кабинетов
  # (раздел 11) внешние сервисы продолжают их слать, и wms обязана их принимать.
  # ---------------------------------------------------------------------------
  wms.reserve.v1:
    address: wms.reserve.v1
    title: Команда «зарезервировать под задание»
    description: >-
      Форма — приложение C, `/reservations`. Целевой путь — синхронный HTTP-вызов
      того же маршрута; сообщение остаётся только для совместимости на время миграции.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.reserve.v1'

  wms.cancel.v1:
    address: wms.cancel.v1
    title: Команда «отменить задание»
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.cancel.v1'

  wms.return.v1:
    address: wms.return.v1
    title: Команда «оформить возврат по заданию»
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return.v1'

  wms.return-request.v1:
    address: wms.return-request.v1
    title: Команда «заявка на возврат»
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return-request.v1'

  # ---------------------------------------------------------------------------
  # События резерва и подбора
  # ---------------------------------------------------------------------------
  wms.reservation.succeeded.v1:
    address: wms.reservation.succeeded.v1
    title: Резерв создан
    description: >-
      Издаётся из той же транзакции, что создала `wms_task` и `reservation`
      (раздел 6.2). Расхождение «заказ есть, резерва нет» невозможно по построению.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.reservation.succeeded.v1'

  wms.reservation.failed.v1:
    address: wms.reservation.failed.v1
    title: Резерв не создан
    description: >-
      `error_code` обязателен и берётся из закрытого списка приложения C.
      Немаппленный товар уходит сюда с `PRODUCT_MAPPING_MISSING` и переводит задание
      в `manual_review`, а не в тихую отмену — как раз та дыра из раздела 3.2.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.reservation.failed.v1'

  wms.stock.shortfall.v1:
    address: wms.stock.shortfall.v1
    title: Собрано без остатка (клапан ledger_short)
    description: >-
      Новое в версии 1.2 мастера (раздел 6.5). Товара по учёту не хватило, но резерв
      всё равно создан: движение с `reason = 'ledger_short'` и
      `discrepancy(kind='ledger_short')` пишутся в той же транзакции. Смена не встаёт,
      но ошибка становится видимой, счётной и адресной — экран начальника склада плюс
      счётчик Prometheus. Молчаливого `_force_reservation` больше нет (инвариант 12).
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.stock.shortfall.v1'

  wms.receipt.completed.v1:
    address: wms.receipt.completed.v1
    title: Приёмка завершена
    description: >-
      Новое в версии 1.3 мастера. Приёмку было нечем ни эмитить, ни тарифицировать:
      инвариант 13 требует событие на любое физическое движение, а раздел 3.4 числит
      приёмку среди услуг с тарифом. Ближайшее по смыслу
      `inventory.movement.recorded.v1` не годится дважды: оно сопровождает почти
      всякое движение (счёт вышел бы на каждую строку) и требует `order_id`, которого
      у приёмки нет — приёмка приходит без заказа.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.receipt.completed.v1'

  wms.picking.started.v1:
    address: wms.picking.started.v1
    title: Подбор начат
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.picking.started.v1'

  wms.item.scanned.v1:
    address: wms.item.scanned.v1
    title: Скан у стойки
    description: >-
      Тарифицируемое и учётное действие одновременно (инвариант 13). Поток C считает
      по нему выработку смены, поэтому в payload есть и `owner_id`, и
      `seller_external_id`: биллинг знает клиента по внешнему идентификатору.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.item.scanned.v1'

  wms.picking.completed.v1:
    address: wms.picking.completed.v1
    title: Подбор завершён
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.picking.completed.v1'

  wms.packing.completed.v1:
    address: wms.packing.completed.v1
    title: Упаковка завершена (контрольный скан пройден)
    description: >-
      Главный рубеж качества склада (раздел 4) и тарифицируемая операция потока C.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.packing.completed.v1'

  wms.label.attached.v1:
    address: wms.label.attached.v1
    title: Этикетка привязана к заданию
    description: >-
      Стикер тянется заранее и лежит локально (раздел 6.6, инвариант 9). В событие
      едут идентификатор, формат и sha256, но НЕ сам ZPL: событие — уведомление,
      а не канал доставки полезной нагрузки на 10 МБ.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.label.attached.v1'

  wms.returned.to.shelf.v1:
    address: wms.returned.to.shelf.v1
    title: Товар возвращён на полку
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.returned.to.shelf.v1'

  wms.stock.released.v1:
    address: wms.stock.released.v1
    title: Резерв снят, товар вернулся в good
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.stock.released.v1'

  wms.order.cancelled.v1:
    address: wms.order.cancelled.v1
    title: Задание отменено
    description: >-
      `cancel_reason` обязателен на уровне схемы БД (инвариант 11) и здесь тоже:
      2645 отмен с `manual_review_reason = NULL` в боевом контуре — прямое следствие
      того, что причина была необязательной.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.order.cancelled.v1'

  # ---------------------------------------------------------------------------
  # Возвраты — контрактный минимум (раздел 6.7, открытый вопрос 10)
  # ---------------------------------------------------------------------------
  wms.return.expected.v1:
    address: wms.return.expected.v1
    title: Возврат ожидается
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return.expected.v1'

  wms.return.received.v1:
    address: wms.return.received.v1
    title: Возврат принят на склад
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return.received.v1'

  wms.return.resellable.v1:
    address: wms.return.resellable.v1
    title: Возврат годен к продаже
    description: 'Решение по возврату: товар уходит в состояние `good`.'
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return.resellable.v1'

  wms.return.defective.v1:
    address: wms.return.defective.v1
    title: Возврат браком
    description: 'Решение по возврату: товар уходит в состояние `defect`.'
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wms.return.defective.v1'

  # ---------------------------------------------------------------------------
  # Журнал остатков
  # ---------------------------------------------------------------------------
  inventory.movement.recorded.v1:
    address: inventory.movement.recorded.v1
    title: Движение товара записано
    description: >-
      Схема payload перенесена из приложения E дословно и НЕ расширяется: под неё
      уже написаны потребители в биллинге и аналитике. Поля `owner_id`/`cell_id`
      здесь отсутствуют намеренно — их источник истины `stock_move`, доступный
      по HTTP; событие остаётся уведомлением.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/inventory.movement.recorded.v1'

  inventory.stock.updated.v1:
    address: inventory.stock.updated.v1
    title: Остаток пересчитан
    description: >-
      Издаётся после каждого движения. `available = good - buffer`
      и всегда занижается (инвариант 6.4/7). Публикация в WB уходит немедленно,
      без таймеров, — событие лишь уведомляет портал и каталог о том, что уже сделано.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/inventory.stock.updated.v1'

  # ---------------------------------------------------------------------------
  # Унаследовано от поглощённого `wb-fbs-gateway` (раздел 6.3). Полный каталог wb.*
  # живёт в контракте шлюза; здесь только те четыре, чьи схемы приложение E задаёт
  # дословно, — они издаются тем же outbox сервиса `wms` и на них уже подписаны
  # биллинг (wb.supply.shipped.v1 — 62 начисления за месяц) и возвраты.
  # ---------------------------------------------------------------------------
  wb.fbs.order.synced.v1:
    address: wb.fbs.order.synced.v1
    title: Задание WB получено опросом
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wb.fbs.order.synced.v1'

  wb.fbs.order.updated.v1:
    address: wb.fbs.order.updated.v1
    title: Задание WB изменилось
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wb.fbs.order.updated.v1'

  wb.supply.shipped.v1:
    address: wb.supply.shipped.v1
    title: Поставка передана в WB
    description: >-
      Тарифицируемое событие потока C. `accepted_at` = `scanDt` из WB и может быть
      null: передача поставки не доказательство приёмки (раздел 2.12).
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wb.supply.shipped.v1'

  wb.orders.processed.v1:
    address: wb.orders.processed.v1
    title: Заказы обработаны
    description: >-
      Тарифицируемое событие потока C (раздел 3.4) — реальный тип с прода, 150 ₽
      за месяц в диагностике раздела 3. Формы payload не было нигде до версии 1.3
      мастера, и биллинг считал количество единицей как временную меру: при пачке
      заказов клиент был бы недосчитан во столько раз, сколько заказов в пачке.
      Тарифицируемое количество — `orders`, не единица за событие.
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wb.orders.processed.v1'

  wb.fbs.return.detected.v1:
    address: wb.fbs.return.detected.v1
    title: WB сообщил о возврате
    bindings:
      $ref: '#/components/channelBindings/mmxEvents'
    messages:
      envelope:
        $ref: '#/components/messages/wb.fbs.return.detected.v1'

operations:
  # `send` — то, что сервис `wms` кладёт в exchange из собственного outbox.
  # `receive` — то, что он вычитывает из своих очередей.
  receiveWmsReserve:
    action: receive
    channel:
      $ref: '#/channels/wms.reserve.v1'
    summary: Принять команду резерва (совместимость на время миграции)
    tags:
      - name: legacy-command
  receiveWmsCancel:
    action: receive
    channel:
      $ref: '#/channels/wms.cancel.v1'
    summary: Принять команду отмены задания
    tags:
      - name: legacy-command
  receiveWmsReturn:
    action: receive
    channel:
      $ref: '#/channels/wms.return.v1'
    summary: Принять команду оформления возврата
    tags:
      - name: legacy-command
  receiveWmsReturnRequest:
    action: receive
    channel:
      $ref: '#/channels/wms.return-request.v1'
    summary: Принять заявку на возврат
    tags:
      - name: legacy-command

  sendWmsReservationSucceeded:
    action: send
    channel:
      $ref: '#/channels/wms.reservation.succeeded.v1'
    bindings:
      $ref: '#/components/operationBindings/persistent'
    tags:
      - name: wms-core
  sendWmsReservationFailed:
    action: send
    channel:
      $ref: '#/channels/wms.reservation.failed.v1'
    bindings:
      $ref: '#/components/operationBindings/persistent'
    tags:
      - name: wms-core
  sendWmsStockShortfall:
    action: send
    channel:
      $ref: '#/channels/wms.stock.shortfall.v1'
    bindings:
      $ref: '#/components/operationBindings/persistent'
    tags:
      - name: wms-core
  sendWmsReceiptCompleted:
    action: send
    channel:
      $ref: '#/channels/wms.receipt.completed.v1'
    bindings:
      $ref: '#/components/operationBindings/persistent'
    tags:
      - name: wms-core
  sendWmsPickingStarted:
    action: send
    channel:
      $ref: '#/channels/wms.picking.started.v1'
    bindings:
      $ref: '#/components/operationBindings/persistent'
