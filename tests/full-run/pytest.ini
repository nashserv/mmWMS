[pytest]
# Прогон — один сценарий склада, шаги идут в порядке раздела 9.6 и передают
# состояние друг другу. Поэтому файл один и порядок в нём значим; параллельный
# запуск (-p xdist) для этого набора не предусмотрен.
testpaths = .
python_files = test_full_run.py
addopts = -ra --strict-markers
markers =
    stream_a: красный чинит поток A (WMS + Wildberries)
    stream_b: красный чинит поток B (приложение сборщика и приёмщика)
    stream_c: красный чинит поток C (деньги и кабинеты)
