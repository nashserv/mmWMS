[pytest]
# Сам прогон — один сценарий склада: шаги идут в порядке раздела 9.6 и
# передают состояние друг другу. Поэтому шаги живут в одном файле и порядок в
# нём значим; параллельный запуск (-p xdist) для этого набора не предусмотрен.
#
# Рядом лежат проверки самой оснастки: убирает ли уборка за собой
# (`test_purge.py`), отличает ли наблюдатель сеть от дрожания планировщика
# (`test_txnwatch.py`). Они собирались не собираться: `python_files` называл
# один файл, и обе появившиеся проверки молча не запускались ночью — то есть
# не охраняли ничего. Собираем всё; сценарий по-прежнему один файл.
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    stream_a: красный чинит поток A (WMS + Wildberries)
    stream_b: красный чинит поток B (приложение сборщика и приёмщика)
    stream_c: красный чинит поток C (деньги и кабинеты)
