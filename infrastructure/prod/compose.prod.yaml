# Боевой контур mmWMS — шаги 4–6 раздела 11.
#
# ЗАПУСКАТЬ ТОЛЬКО ПОСЛЕ ЯВНОГО РАЗРЕШЕНИЯ ВЛАДЕЛЬЦА НА КОНКРЕТНЫЙ ШАГ И
# КОНКРЕТНЫЙ КАБИНЕТ (раздел 12). Переключение идёт по одному кабинету, не
# пачкой; откат на любом шаге — вернуть кабинет боевому шлюзу.
#
# Чем отличается от стенда — и почему.
#
#   1. Ворот `check-no-live-tokens.sh` ЗДЕСЬ НЕТ, и это не забывчивость.
#      На стенде живой токен Wildberries — авария: прогон отправил бы
#      настоящие команды в кабинет клиента. Здесь живой токен — смысл работы.
#      Те же ворота на бою не пустили бы контур подняться вовсе. Вместо них
#      стоит `preflight.sh`, который проверяет обратное: что токен есть, что
#      кабинет ровно один, что режим кабинета `live`, что база своя.
#
#   2. Симулятора Wildberries нет. `WB_API_URL` обязателен: с пустым адресом
#      сервис счёл бы, что рядом симулятор, и это единственная дорога, которой
#      можно случайно писать не туда.
#
#   3. Сидов нет. Клиенты, кабинеты и тарифы заводятся через API, а не
#      скриптом: сид — это данные под тесты, и на бою им не место.
#
#   4. Тестовых баз и `*-test-migrate` нет.
#
#   5. Каждый сервис ходит под своей ролью `svc_*` с первого дня. На стенде
#      это включили задним числом; здесь иначе и не начинаем.
#
#   6. `APP_ENV: production` везде. От него зависит не логирование, а запреты:
#      `wb.writes_allowed`, отказ `identity` работать без ключа, отказ биллинга
#      отдавать деньги неизвестно кому.

name: mmx-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "10"

x-wms-env: &wms-env
  APP_ENV: production
  # Заглушка на бою запрещена. Не «по умолчанию false», а именно запрещена:
  # WMS_MOCK=true здесь означал бы склад, который отвечает выдуманное.
  WMS_MOCK: "false"
  DATABASE_URL: postgresql://svc_wms:${SERVICE_DB_PASSWORD_WMS:?set outside Git}@postgres:5432/wms
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?set outside Git}:${RABBITMQ_PASSWORD:?set outside Git}@rabbitmq:5672/
  MMX_EVENTS_EXCHANGE: mmx.events
  MMX_TENANT_ID: ${MMX_TENANT_ID:?set outside Git}
  IDENTITY_URL: http://identity:8080
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set outside Git}
  # Настоящий Wildberries. Обязателен — см. пункт 2 в шапке.
  WB_API_URL: ${WB_API_URL:?set outside Git}
  # РОВНО ОДИН кабинет на шагах 4–5. Раздел 11 требует переключать по одному,
  # и разрешение владельца нужно на каждый следующий отдельно. Пустое значение
  # означало бы «все кабинеты сразу» — поэтому переменная обязательна.
  WB_SYNC_ONLY_ACCOUNTS: ${PROD_WB_ACCOUNTS:?set outside Git}
  # Секрет по ссылке. Значение токена в переменных не появляется никогда
  # (инвариант 15): файл монтируется на чтение, имя файла — это secret_ref.
  WB_SECRET_DIR: /run/secrets/wb
  WB_STICKER_FORMAT: ${WB_STICKER_FORMAT:?вопрос 2 раздела 13 — проверить на живом принтере}

x-wb-secrets: &wb-secrets
  volumes:
    - ${WB_SECRET_HOST_DIR:?set outside Git}:/run/secrets/wb:ro

services:

  # ------------------------------------------------------------- хранилища

  postgres:
    image: postgres:16.10-alpine3.22
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set outside Git}
      POSTGRES_DB: wms
    volumes:
      - prod-postgres:/var/lib/postgresql/data
      - ../stand/scripts/create-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms} -d wms"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Порт наружу не публикуется вовсе. На стенде он открыт на петлевой адрес
    # ради тестов; здесь тестов нет, а открытый порт — это дверь.

  pg-backup:
    image: postgres:16.10-alpine3.22
    <<: [*restart, *logging]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set outside Git}
      # На бою дампы хранятся дольше стендовых двух недель: восстановление
      # «на позавчера» — обычная просьба бухгалтерии, а не авария.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-45}
    volumes:
      - ../stand/scripts/backup.sh:/backup.sh:ro
      - ${PROD_BACKUP_DIR:?set outside Git}:/backups
    entrypoint: ["/bin/bash", "/backup.sh"]

  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    <<: [*restart, *logging]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set outside Git}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set outside Git}
    volumes:
      - prod-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10

  rabbitmq-init:
    image: rabbitmq:4.1.2-management-alpine
    depends_on:
      rabbitmq: {condition: service_healthy}
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set outside Git}:${RABBITMQ_PASSWORD:?set outside Git}@rabbitmq:5672/
      RABBITMQ_HTTP: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:?set outside Git}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set outside Git}
    volumes:
      - ../stand/scripts/rabbitmq-init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: on-failure

  # ------------------------------------------------------------- миграции
  #
  # Под ВЛАДЕЛЬЦЕМ баз, а не под ролью сервиса: они создают таблицы, и роли
  # сервиса этого делать нельзя — в этом и смысл разделения.

  migrate: &migrate
    image: postgres:16.10-alpine3.22
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/wms
    volumes:
      - ../../services/wms/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    restart: on-failure

  identity-migrate:
    <<: *migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/identity
    volumes:
      - ../../services/identity/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro

  billing-migrate:
    <<: *migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/billing
    volumes:
      - ../../services/billing/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro

  workstation-migrate:
    <<: *migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/workstation
    volumes:
      - ../../services/fbs-operator-workstation/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro

  portal-migrate:
    <<: *migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/portal
    volumes:
      - ../../services/portal/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro

  internal-admin-migrate:
    <<: *migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?set outside Git}@postgres:5432/internal_admin
    volumes:
      - ../../services/internal-admin/migrations:/migrations:ro
      - ../stand/scripts/migrate.sh:/migrate.sh:ro

  # ------------------------------------------------------------------ wms

  wms:
    build:
      context: ../../services/wms
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging, *wb-secrets]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq-init: {condition: service_completed_successfully}
      identity: {condition: service_healthy}
    environment:
      <<: *wms-env
      WMS_ROLE: api
      TRUSTED_HOSTS: ${PROD_TRUSTED_HOSTS:?set outside Git}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: ["127.0.0.1:8080:8080"]

  # Воркеры — отдельными процессами (раздел 12): упал опрос Wildberries, а
  # приёмка, подбор и инвентаризация продолжают работать.

  wms-wb-sync: &wms-worker
    build:
      context: ../../services/wms
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging, *wb-secrets]
    depends_on:
      wms: {condition: service_healthy}
    environment:
      <<: *wms-env
      WMS_ROLE: wb-sync
      # Частота опроса делится с боевым шлюзом: у кабинета 300 запросов в
      # минуту ВСЕГО. Считает infrastructure/shadow/scripts/poll-budget.py.
      WB_SYNC_INTERVAL_SECONDS: ${PROD_POLL_INTERVAL_SECONDS:?вопрос 11 раздела 13}
    command: ["python", "-m", "app.workers.wb_sync"]

  wms-wb-labels:
    <<: *wms-worker
    environment:
      <<: *wms-env
      WMS_ROLE: wb-labels
    command: ["python", "-m", "app.workers.wb_labels"]

  wms-wb-reconcile:
    <<: *wms-worker
    environment:
      <<: *wms-env
      WMS_ROLE: wb-reconcile
    command: ["python", "-m", "app.workers.wb_reconcile"]

  wms-outbox:
    <<: *wms-worker
    environment:
      <<: *wms-env
      WMS_ROLE: outbox
    command: ["python", "-m", "app.workers.outbox"]

  # ------------------------------------------------------------- identity

  identity:
    build:
      context: ../../services/identity
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging]
    depends_on:
      identity-migrate: {condition: service_completed_successfully}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://svc_identity:${SERVICE_DB_PASSWORD_IDENTITY:?set outside Git}@postgres:5432/identity
      # Ключ подписи задаётся явно и переживает перезапуск: иначе все выданные
      # токены умирают вместе с процессом (находка 1.2).
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:?set outside Git}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------- биллинг

  billing: &billing
    build:
      context: ../../services/billing
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging]
    depends_on:
      billing-migrate: {condition: service_completed_successfully}
      rabbitmq-init: {condition: service_completed_successfully}
      identity: {condition: service_healthy}
    environment: &billing-env
      APP_ENV: production
      DATABASE_URL: postgresql://svc_billing:${SERVICE_DB_PASSWORD_BILLING:?set outside Git}@postgres:5432/billing
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set outside Git}:${RABBITMQ_PASSWORD:?set outside Git}@rabbitmq:5672/
      MMX_EVENTS_EXCHANGE: mmx.events
      MMX_TENANT_ID: ${MMX_TENANT_ID:?set outside Git}
      IDENTITY_URL: http://identity:8080
      WMS_BASE_URL: http://wms:8080
      # Воркер хранения спрашивает склад о коробо-местах, а склад спрашивает,
      # кто пришёл (находка 1.3). Без токена — 401 на каждый кабинет.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set outside Git}
    ports: ["127.0.0.1:8082:8080"]

  billing-worker:
    <<: *billing
    depends_on:
      billing-migrate: {condition: service_completed_successfully}
      rabbitmq-init: {condition: service_completed_successfully}
      # Склад — источник данных для хранения: без ожидания воркер первым же
      # тактом пометит сутки «склад недоступен» по всем кабинетам сразу.
      wms: {condition: service_healthy}
    ports: []
    command: ["python", "-m", "app.worker"]

  billing-inbox-consumer:
    <<: *billing
    ports: []
    command: ["python", "-m", "app.consumer"]

  # ------------------------------------------------------- рабочее место

  workstation:
    build:
      context: ../../services/fbs-operator-workstation
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging]
    depends_on:
      workstation-migrate: {condition: service_completed_successfully}
      wms: {condition: service_healthy}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://svc_workstation:${SERVICE_DB_PASSWORD_WORKSTATION:?set outside Git}@postgres:5432/workstation
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set outside Git}:${RABBITMQ_PASSWORD:?set outside Git}@rabbitmq:5672/
      WMS_BASE_URL: http://wms:8080
      WMS_SERVICE_TOKEN: ${SERVICE_TOKEN:?set outside Git}
      IDENTITY_URL: http://identity:8080
      # Общий секрет агента печати. Вне локальных сред обязателен: без него в
      # сокет агента приходил кто угодно (находка 1.6).
      PRINT_AGENT_SECRET: ${PRINT_AGENT_SECRET:?set outside Git}
    ports: ["127.0.0.1:8081:8080"]

  # ----------------------------------------------- портал и админка

  portal:
    build:
      context: ../../services/portal
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging]
    depends_on:
      portal-migrate: {condition: service_completed_successfully}
      identity: {condition: service_healthy}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://svc_portal:${SERVICE_DB_PASSWORD_PORTAL:?set outside Git}@postgres:5432/portal
      IDENTITY_URL: http://identity:8080
      BILLING_URL: http://billing:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set outside Git}
    ports: ["127.0.0.1:8083:8080"]

  internal-admin:
    build:
      context: ../../services/internal-admin
      args: {GIT_SHA: "${GIT_SHA:-unknown}"}
    <<: [*restart, *logging]
    depends_on:
      internal-admin-migrate: {condition: service_completed_successfully}
      identity: {condition: service_healthy}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://svc_admin:${SERVICE_DB_PASSWORD_ADMIN:?set outside Git}@postgres:5432/internal_admin
      IDENTITY_URL: http://identity:8080
      BILLING_URL: http://billing:8080
      WMS_BASE_URL: http://wms:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set outside Git}
    ports: ["127.0.0.1:8084:8080"]

  # ------------------------------------------------------- наблюдаемость
  #
  # Не украшение: без неё «работает» и «молчит» неразличимы. Именно этим болен
  # боевой контур сегодня (раздел 3.5) — dead_letters пуст при регулярных
  # потерях заданий, потому что очереди не существовало вовсе.

  prometheus:
    image: prom/prometheus:v3.6.0
    <<: [*restart, *logging]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../stand/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prod-prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    <<: [*restart, *logging]
    environment:
      ALERTMANAGER_WEBHOOK: ${ALERTMANAGER_WEBHOOK:?набор дежурного — set outside Git}
    volumes:
      - ../stand/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - prod-alertmanager:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed "s|\$ALERTMANAGER_WEBHOOK|${ALERTMANAGER_WEBHOOK}|"
        /etc/alertmanager/alertmanager.yml > /alertmanager/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    ports: ["127.0.0.1:9093:9093"]

volumes:
  prod-postgres: {}
  prod-rabbitmq: {}
  prod-prometheus: {}
  prod-alertmanager: {}
