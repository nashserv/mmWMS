# Куда уходят сработавшие алерты.
#
# Адрес приёмника задаётся снаружи Git (ALERTMANAGER_WEBHOOK): на стенде это
# что угодно, принимающее POST, в бою — бот дежурного. Вписывать сюда
# конкретный адрес нельзя: в нём токен (инвариант 15).
global:
  resolve_timeout: 5m

route:
  receiver: дежурный
  # Группировка по алерту и сервису: двадцать заданий, разошедшихся с WB, —
  # одно сообщение, а не двадцать. Двадцать сообщений читают как спам и
  # выключают уведомления, после чего молчат уже все.
  group_by: ['alertname', 'service', 'job']
  group_wait: 30s
  group_interval: 5m
  # Повтор раз в четыре часа: алерт, о котором сказали один раз и забыли, —
  # это тот же необработанный инцидент, только с ощущением, что о нём знают.
  repeat_interval: 4h

receivers:
  - name: дежурный
    webhook_configs:
      - url: '$ALERTMANAGER_WEBHOOK'
        send_resolved: true

# Пока горит «склад встал», не писать про каждое отдельное расхождение:
# дежурный и так занят главным.
inhibit_rules:
  - source_matchers: ['severity = critical']
    target_matchers: ['severity = warning']
    equal: ['job']
