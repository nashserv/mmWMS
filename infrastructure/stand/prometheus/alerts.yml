# Алерты стенда. Каждое правило — из раздела 10 мастера («критерии идеально»)
# или из инварианта раздела 8. Правил без источника здесь нет.
#
# Главный урок боевого контура: мониторинг следил за портами, а не за работой
# (раздел 3.5). Четыре воркера стояли Up с зелёным healthcheck и нулём строк
# лога. Поэтому ниже нет ни одного правила вида «процесс жив».

groups:

  - name: wms-workers
    rules:
      # Инвариант 14: молчащий воркер считается сломанным.
      #
      # Смотрим на ПУЛЬС, а не на работу. Правило на
      # `worker_processed_total == 0` срабатывало бы каждую тихую ночь: воркер
      # жив, очередь пуста, обработано ноль — и дежурный приходит к исправному
      # складу. Пара таких вызовов, и уведомления выключают, после чего молчит
      # уже всё.
      #
      # Ноль тактов значит ровно одно: воркер не крутится. Две минуты — с
      # запасом: самый медленный такт (сверка) ходит раз в минуту.
      - alert: WorkerSilent
        expr: |
          sum by (worker) (increase(mmx_wms_worker_ticks_total[2m])) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Воркер {{ $labels.worker }} не сделал ни одного такта за две минуты"
          description: >-
            Воркер не крутится. В боевом контуре так молчали
            gateway-sync-worker, gateway-command-worker, catalog-stock-worker и
            workstation-inbox-consumer — при этом healthcheck был зелёный.
            Проверять работу, а не порт.

      # Воркер крутится, но ничего не делает НЕОБЫЧНО долго.
      #
      # Отдельно от пульса и мягче: ночью это норма, а вот опросчик, не
      # заведший ни одного задания за смену, — уже вопрос. Предупреждение, не
      # вызов дежурного.
      - alert: WorkerIdleTooLong
        expr: |
          sum by (worker) (increase(mmx_wms_worker_processed_total[6h])) == 0
          and on (worker) sum by (worker) (increase(mmx_wms_worker_ticks_total[10m])) > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Воркер {{ $labels.worker }} крутится, но за шесть часов не сделал ничего"
          description: >-
            Пульс есть, работы нет. Ночью это норма; днём значит, что до
            воркера не доходит то, что он обязан обрабатывать.

  - name: wms-invariants
    rules:
      # Инвариант 10: расхождение с WB — состояние и алерт, а не тихая запись.
      - alert: TasksDiverged
        expr: mmx_wms_tasks_diverged > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Расхождение статуса с Wildberries: {{ $value }} заданий"
          description: >-
            Наш статус не сходится со статусом WB. В боевом контуре таких
            заданий 2467 из 6374, и все они молчали. Это будит человека.

      # Инвариант 12: сборка без остатка обязана быть видимой и счётной.
      - alert: LedgerShortBurst
        expr: increase(mmx_wms_stock_shortfall_total[1h]) > 10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Сборок без остатка за час: {{ $value }}"
          description: >-
            Клапан раздела 6.5 сработал больше десяти раз за час. Смена не
            встала — это правильно, но учёт разошёлся с полкой, и инвентаризация
            должна прийти по адресам из discrepancy(kind='ledger_short').

      # Инвариант 4: удержание блокировки под 100 мс, и это измеряется.
      - alert: LockHeldTooLong
        expr: |
          histogram_quantile(0.99,
            sum by (le, operation) (rate(mmx_wms_lock_hold_seconds_bucket[5m]))) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p99 удержания блокировки {{ $labels.operation }} выше 100 мс"
          description: >-
            Скорее всего внутрь транзакции попал HTTP-вызов (инвариант 2).
            Вызов WB на 500 мс внутри блокировки роняет пропускную способность
            на три порядка.

  - name: wms-criteria
    rules:
      # Раздел 10: нажатие «печать» → движение головки < 300 мс.
      - alert: LabelPrintSlow
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(mmx_wms_label_print_duration_seconds_bucket[5m]))) > 0.3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p99 печати этикетки выше 300 мс"
          description: >-
            Цель — меньше 300 мс от нажатия до движения головки. Сейчас
            {{ $value | humanizeDuration }}. Проверить, что стикер берётся
            локально, а не запрашивается у WB в момент упаковки.

      # Инвариант 9: стикер лежит локально до того, как человек нажал печать.
      - alert: LabelsNotPrefetched
        expr: mmx_wms_labels_ready == 0 and sum(mmx_wms_tasks{state="reserved"}) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Есть зарезервированные задания, но ни одного готового стикера"
          description: >-
            Стикеры перестали тянуться заранее. Упаковщик будет ждать WB —
            ровно та беда, которую чиним (раздел 6.6).

      - alert: ServiceNotReady
        expr: mmx_service_ready == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Сервис {{ $labels.service }} не готов"

  # ------------------------------------------------------------ добавлено этапом 5
  #
  # Все четыре правила закрывают одно и то же: работа встала, а выглядит это
  # как тишина. Именно так боевой контур терял выручку месяцами.

  - name: wms-outbox-and-limits
    rules:
      # Инвариант 13: событие обязано доехать до шины. Нарастающая очередь
      # публикации значит, что оно не доезжает — а потребители не знают.
      - alert: OutboxBacklog
        expr: mmx_wms_outbox_unpublished > 500
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "В outbox {{ $value }} неопубликованных событий"
          description: >-
            На проде integration_outbox дорос до 136 210 записей без чистки
            (раздел 3.6), и никто этого не заметил. Событие, не доехавшее до
            шины, — это несчитанная услуга и невыставленный счёт.

      # Приложение D: лимит 300 запросов в минуту на кабинет. Кабинет,
      # упёршийся в него надолго, перестаёт получать задания вовсе.
      - alert: WbRateLimited
        expr: mmx_wms_wb_rate_limited > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Кабинетов под ограничением Wildberries: {{ $value }}"
          description: >-
            Опрос заданий, стикеры и публикация остатка делят один бюджет.
            Кабинет под паузой не получает новые заказы, и склад не знает,
            что их не получает.

      # Инвариант 7: остаток публикуется сразу после движения. Непрошедшая
      # публикация означает, что Wildberries продаёт то, чего нет.
      - alert: StockPushFailing
        expr: |
          sum(increase(mmx_wms_stock_push_total{outcome!="ok"}[15m])) > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "Публикация остатка не проходит ({{ $value }} за 15 минут)"
          description: >-
            Остаток в кабинете расходится с нашим до следующего движения по
            тому же товару — у редкого товара это недели. Wildberries
            продолжает продавать то, чего на складе нет.

      # Задание, о котором Wildberries молчит: подменили токен, смотрим не
      # тот кабинет, заказ удалён.
      - alert: WbOrdersMissing
        expr: sum(mmx_wms_wb_orders_missing) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Wildberries не знает {{ $value }} наших заданий"
          description: >-
            Сверка спрашивает статусы поимённо. Молчание WB про наше задание
            значит, что заказа в кабинете нет — и собирать его незачем.

  - name: billing
    rules:
      # Раздел 3.4: 6374 задания против 145 начислений. Неоплаченная работа
      # копится молча.
      - alert: UnbilledGrowing
        expr: sum(increase(mmx_billing_unbilled_total[1h])) > 10
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: "За час не дошло до счёта событий: {{ $value }}"
          description: >-
            Работа сделана, счёт не выставлен. Разбирается по
            /api/billing/v1/reports/unbilled; переигрывается
            POST /unbilled/{event_id}/replay после устранения причины.

      # Мёртвые письма. На проде dead_letters пуст при регулярных потерях
      # заданий (раздел 3.5) — потому что очереди не существовало вовсе.
      - alert: DeadLettersGrowing
        expr: rabbitmq_queue_messages{queue="stand.dead-letters"} > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "В мёртвых письмах {{ $value }} сообщений"
          description: >-
            Событие не обработано и ждёт человека. Пустая очередь мёртвых
            писем при потерях означала бы, что терялось в никуда.

  - name: stock-truth
    rules:
      # Инвариант 1: stock_balance — проекция журнала, а не самостоятельная
      # запись. Расхождение с последним пересчётом означает, что где-то
      # пишут мимо журнала — ровно то, чем болен боевой контур.
      - alert: BalanceDivergesFromCount
        expr: mmx_wms_inventory_divergence > 0
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Остаток расходится с последним пересчётом: {{ $value }} позиций"
          description: >-
            Либо кто-то пишет в stock_balance мимо журнала, либо пересчёт не
            применился. В боевом контуре это выглядело как 3528 единиц в
            кабинете при 92 на складе.
